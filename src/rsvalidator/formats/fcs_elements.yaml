        meaning: Read Miscellaneous Register Data
      - value: '32'
        meaning: TOU Calendar Update
      import: required
      page: 103
    - name: RequestedDate
      type: DateTime
      valid: Format = yyyy-mm-dd
      import: required
      page: 103
    - name: RequestedTime
      type: DateTime
      valid: Format = hh:mm:ss
      import: required
      page: 103
    - name: RequiredFlag
      type: Boolean
      values:
      - value: 'false'
        meaning: Read is not required to consider read complete (default)
      - value: 'true'
        meaning: Read must be collected to consider read complete
      import: optional
      page: 104
    - name: ResetEndpointDateTimeFlag
      type: Boolean
      values:
      - value: 'false'
        meaning: Do not reset endpoint date/time. This is the setting for all secured request types.
      - value: 'true'
        meaning: Reset endpoint date/time after successful read of command (default).
      import: optional
      page: 104
    - name: PromptForServiceSwitchFlag
      type: Boolean
      values:
      - value: 'true'
        meaning: Prompt the data collector user before processing the request.
      - value: 'false'
        meaning: Do not prompt the data collector user before processing the request (default).
      import: optional
      page: 104
    - name: ArmServiceSwitchFlag
      type: Boolean
      values:
      - value: 'true'
        meaning: Arm the service switch.
      - value: 'false'
        meaning: Do not arm the service switch. (default)
      import: optional
      page: 105
    - name: ModeChangeType
      type: Integer
      values:
      - value: '0'
        meaning: Transition Immediately (default)
      - value: '1'
        meaning: On Specific Date/Time
      - value: '2'
        meaning: Cancel Pending Changes.
      import: optional
      page: 105
    - name: ReconfigurationMode
      type: Integer
      values:
      - value: '0'
        meaning: OpenWay
      import: optional
      page: 105
    - name: EffectiveModeDateTime
      type: DateTime
      valid: Format = yyyy-mm-ddThh:mm:ss
      import: optional
      page: 105
    - name: ChannelSelectionForOther
      values:
      - value: '0'
        meaning: Undefined
      - value: '1'
        meaning: Channel 1
      - value: '2'
        meaning: Channel 2
      import: optional
      type: Integer
      review: type not stated in guide; inferred Integer from valid values
      page: 105
    - name: OverrideValueStatusFlag
      type: Boolean
      values:
      - value: 'false'
        meaning: Command is not performed regardless of endpoint's state (default).
      - value: 'true'
        meaning: Command is performed regardless of endpoint's state.
      import: optional
      page: 105
    - name: TOUReadItemListID
      type: String
      length: 40
      valid: Alphanumeric
      import: optional
      page: 106
    - name: TOUCalendarName
      type: String
      length: 32
      valid: Alphanumeric
      import: optional
      page: 106
    - name: IntervalSize
      type: Integer
      values:
      - value: '0'
        meaning: Not used.
      - value: '15'
        meaning: 15 minutes
      - value: '60'
        meaning: 60 minutes (1 hour)
      - value: '1440'
        meaning: 1440 minutes (1 day)
      import: optional
      page: 106
