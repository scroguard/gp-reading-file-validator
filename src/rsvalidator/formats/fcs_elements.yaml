entities:
  SkipCode:
    page: 22
    elements:
    - name: Code
      type: String
      length: 2
      valid: 'Alphanumeric; maximum of two characters. The first character cannot be a space. Use A-Z, a-z, 0-9,
        and special characters, (examples: + / : , ! # ? ( ) < > ), except double quotes ("), for codes. QQ Itron-defined
        code that is only available during a new FCS installation. Used as an Itron-defined submenu. QR Missing
        Required Advanced AMR Read. This is an Itron- defined code and resides under the QQ, Itron-defined submenu.
        It cannot be changed. QZ Forced Skip. This is an Itron-defined code and resides under the QQ, Itron-defined
        submenu. When an error or condition is detected that prevents the collection of reliable data, the read
        code is set to Skipped with a skip code of QZ. It cannot be changed.'
      import: required
      page: 22
    - name: Translation
      type: String
      length: 20
      valid: Alphanumeric, maximum of 20 characters
      import: required
      page: 22
    - name: ProcessedTypeIndicator
      type: Integer
      length: 1
      values:
      - value: '0'
        meaning: Unprocessed. The data collector user is not credited with obtaining a reading and may be reassigned
          for another attempt to gather the read.
      - value: '1'
        meaning: Processed. The data collector user is credited with obtaining a reading.
      import: required
      page: 22
    - name: MainMenuLevelIndicator
      type: Integer
      values:
      - value: '0'
        meaning: Not used (default)
      - value: 1-99
        meaning: Display order and group if Sub Menu Level Indicator defined
      import: optional
      page: 23
    - name: SubMenuLevelIndicator
      type: String
      values:
      - value: ''
        meaning: This is a Main menu item and no Sub menu exists (default).
      - value: '**'
        meaning: (two asterisks) This is a Main menu item and a Sub menu exists.
      - value: 01-99
        meaning: This is a subset item and the value represents the order it will be displayed on the data collector.
      import: optional
      page: 23
    - name: PromptForTroubleCodes
      type: Integer
      values:
      - value: '0'
        meaning: Do not prompt
      - value: '1'
        meaning: Prompt for either the Trouble code or Trouble message, based on the user's selection
      - value: '2'
        meaning: Prompt for a Trouble message
      - value: '3'
        meaning: Prompt for a Trouble code
      import: optional
      page: 23
    - name: DisablePostProcessing
      type: Boolean
      values:
      - value: 'true'
        meaning: Post-processing is disabled.
      - value: 'false'
        meaning: Post-processing is not disabled.
      import: optional
      page: 24
    - name: PhotoPromptIndicator
      type: Boolean
      values:
