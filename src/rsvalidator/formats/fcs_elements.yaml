        meaning: Drive-by (valid only if Drive-by is used)
      - value: '5'
        meaning: "No Read (valid only with PromptCode = 1, display account/reading, but don\u2019t prompt)"
      - value: '6'
        meaning: (no longer used)
      - value: '7'
        meaning: Not used; reserved for use in ReadItem
      import: required
      page: 78
    - name: PromptCode
      type: Integer
      length: 1
      values:
      - value: '0'
        meaning: Prompt the data collector user for a reading (default)
      - value: '1'
        meaning: Display the customer/reading, but do not prompt for a reading (passby)
      - value: '2'
        meaning: Indicates a Must read which displays a warning if the data collector user enters a Skip code, but
          entering a Skip code is allowed and the read is considered skipped
      - value: '3'
        meaning: Indicates a Force read which prevents a reading from being skipped (assigned a Skip code)
      import: required
      page: 79
    - name: TextPrompt
      type: String
      length: 5
      valid: Alphanumeric, maximum of 5 characters
      import: required
      page: 79
    - name: ReadDirection
      type: Integer
      length: 1
      values:
      - value: '0'
        meaning: Not used (default)
      - value: '1'
        meaning: The reading is to be entered on the collector from left to right
      - value: '2'
        meaning: The reading is to be entered on the collector from right to left
      import: optional
      page: 79
    - name: CompareCode
      import: optional
      page: 79
    - name: ConsecutiveEstimates
      type: Byte
      valid: 0 - 99 (default = 0)
      import: optional
      page: 79
    - name: TypeOfValidationIndicator
      type: Integer
      length: 3
      values:
      - value: '0'
        meaning: Normal Consumption Validation (default). Validates each reading against its maximum and minimum
          usage levels to perform the High1/Low1 and High2/Low2 validations.
      - value: '1'
        meaning: Reset Demand Validation. Works with demand readings that are reset monthly. The previous reading
          is not subtracted from the current reading before the system validates the reading against the maximum
          and minimum usage numbers.
      - value: '2'
        meaning: Date Validation. Verifies the date the data collector user enters against the date in the collector.
      - value: '3'
        meaning: Time Validation. Verifies the time the data collector user enters against the time in the collector.
      - value: '4'
        meaning: Meter Number Validation. Verifies the meter number the data collector user enters against the meter
          number in the collector.
      - value: '7'
        meaning: Match Previous Read. Represents a generic comparison of values returned from a collector to values
          in the previous reading field.
      - value: '99'
        meaning: No validation. No validation is performed at all.
      import: required
      page: 80
    - name: Hi1
      type: Integer
      length: 10
      valid: 0 - 2,147,483,647
      import: required
      page: 80
    - name: Hi2
      type: Integer
      length: 10
      valid: 0 - 2,147,483,647
      import: required
      page: 80
    - name: Low1
      type: Integer
      length: 10
      valid: 0 - 2,147,483,647
      import: required
      page: 81
    - name: Low2
      type: Integer
      length: 10
      valid: 0 - 2,147,483,647
      import: required
      page: 81
