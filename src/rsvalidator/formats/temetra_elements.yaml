# GENERATED by tools/extract_fcs_guide.py --profile temetra from the Temetra XML File Format
# Reference Guide (LDI-0587 REV 002), chapter "XML Import File".
# Page numbers are the guide's printed pages. Hand corrections belong in
# formats/temetra.yaml, not here.
entities:
  SkipCode:
    page: 13
    elements:
    - name: Code
      type: String
      length: 2
      valid: 'Alphanumeric; maximum of two characters. The first character cannot be a space. Use A-Z, a-z, 0-9,
        and special characters, (examples: + / : , ! # ? ( ) < > ), except double quotes ("), for codes. QF Itron
        defined code that is available during a new Temetra install or during and existing Temetra upgrade. When
        a return error, tamper, or AAMR response is detected for RF endpoints, the code is set to Skipped with a
        skip code of QF. If the return errors, tampers, or AAMR responses associated with skip code QF are detected,
        the user should investigate the errors with Endpoint Tools, replace the device, or reprogram the device.
        QQ Itron-defined code that is only available during a new Temetra installation. Used as an Itron-defined
        submenu. QR Missing Required Advanced AMR Read. This is an Itron-defined code and resides under the QQ,
        Itron-defined submenu. It cannot be changed. QZ Forced Skip. This is an Itron-defined code and resides under
        the QQ, Itron-defined submenu. When an error or condition is detected that prevents the collection of reliable
        data, the read code is set to Skipped with a skip code of QZ. It cannot be changed.XML Import: Required'
      import: required
      page: 13
    - name: Translation
      type: String
      length: 20
      valid: Alphanumeric, maximum of 20 characters
      import: required
      page: 13
    - name: ProcessedTypeIndicator
      type: Integer
      length: 1
      values:
      - value: '0'
        meaning: Unprocessed. The data collector user is not credited with obtaining a reading and may be reassigned
          for another attempt to gather the read.
      - value: '1'
        meaning: Processed. The data collector user is credited with obtaining a reading.
      import: required
      page: 14
    - name: MainMenuLevelIndicator
      type: Integer
      values:
      - value: '0'
        meaning: Not used (default)
      - value: 1-99
        meaning: Display order and group if Sub Menu Level Indicator defined
      import: optional
      page: 14
    - name: PromptForTroubleCodes
      type: Integer
      values:
      - value: '0'
        meaning: Do not prompt
      - value: '1'
        meaning: Prompt for either the Trouble code or Trouble message, based on the user's selection
      - value: '2'
        meaning: Prompt for a Trouble message
      - value: '3'
        meaning: Prompt for a Trouble code
      import: optional
      page: 14
    - name: PhotoPromptIndicator
      type: Boolean
      values:
      - value: 'true'
        meaning: Photo prompt enabled.
      - value: 'false'
        meaning: Photo prompt is disabled.
      import: optional
      page: 14
  InstructionLocationCode:
    page: 15
    elements:
    - name: InstructionLocationTypeInd
      alias: InstructionLocationTypeIndicator
      type: Integer
      length: 1
      values:
      - value: '1'
        meaning: Meter Location code
      - value: '2'
        meaning: Read Instruction code
      import: required
      page: 15
    - name: Code
      type: String
      length: 2
      valid: Alphanumeric; maximum of two characters. The first character cannot be a space.
      import: required
      page: 15
    - name: Translation
