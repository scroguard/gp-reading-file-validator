# GENERATED by tools/extract_temetra_csv_guide.py from the Temetra NAM CSV File Format
# Guide (LDI-0665 REV 002, December 2024). Page numbers are the guide's pages.
# Hand corrections belong in formats/temetra.yaml, not here.
fields:
- name: CREF
  page: 15
  type: Alphanumeric
  max: 30
  required: 'Yes'
  values: Must be unique per network
  desc: Use to look up a meter, if provided. Will be used for meter replacements in North America networks.
- name: CANCREATE
  page: 15
  required: 'Yes'
  desc: ''
- name: MCATEGORY
  page: 15
  type: Numeric
  values: 0 = Electric 1 = Gas 4 = Water
  desc: Defines the meter type. If a CSV import is used, MCATEGORY is required to retrieve AAMR data.
- name: COLLECTIONMETHOD
  page: 16
  type: Text
  required: 'Yes'
  values: ■ Manual Read ■ Wireless ■ Gen5 500G ERT ■ Gen5 500W ERT ■ Gen5 Intelis Gas ■ Riva 500G ERT ■ Riva 500W
    ERT ■ Cellular 500W ERT ■ Cellular 500G ERT ■ Wand ■ Fixed Network
  desc: 'Set the collection method for the meter (Manual Read, Wireless, etc.) - should be an exact match from the
    collection methods list shown when editing a meter. NOTE: Wireless is required to read Itron ERTs with Temetra
    Mobile. ■ Manual Read - keyed meters read by Temetra. ■ Mobile Wireless - meters read wirelessly with Temetra
    Mobile ■ Wand - Meters read with VersaProbe and TM ■ Fixed Network - Meters read with Itron ChoiceConnect or
    Tantalus ■ Gen5 500 - Meters equiped with a 500G/500W ERT and read with a GEN5 AMI network. ■ Gen5 Intelis -
    meters equiped with a Gen5 gas ERT, read with gen5 AMI network. ■ Riva 500 - meters equiped with a Riva 500G
    or 550W ERT, read with Openway Riva AMI network. ■ Cellular 500 - meters equiped with a Cellular 500W or 500G
    ERT, read using a cellular network.'
- name: MIUSERIAL
  page: 17
  type: Numeric
  max: 50
  required: 'Yes'
  values: Must be unique per network
  desc: Set the endpoint ID.for the meter. Also used to set the ID for a Versaprobe meter. If your endpoint ID has
    leading zeros, make sure they are included.
- name: MIUINSTALLATIONDATE
  page: 17
  type: Date in format DD/MM/YYYY
  values: Many features are dependent upon tags being set correctly. See Appendix H – Supported Tags on page 1
  desc: Set the endpoint installation date for the meter. The format of this should be DD/MM/YYYY
- name: ADDACCOUNTTAG
  page: 17
  type: Character
  max: 500
  desc: Add a tag to the tags field of the customer if it is not already there.
- name: REMOVEACCOUNTTAG
  page: 18
  type: Character
  values: Remove any existing tags that match tags currently present on the customer.
  desc: Remove a tag from the tags field of the customer.
- name: METERBRAND
  page: 18
  type: Actaris, Elster, Itron etc. -
  values: Available brands depend on network type and what brands are permitted. Refer the Temetra Web User Guide
    for a complete list.
  desc: The brand of meter (Actaris, Elster etc.) - should be an exact match from brands list shown when editing
    a meter
- name: METERMODEL
  page: 18
  max: 1
  required: 'Yes'
  values: Depends on the brand selected. Refer the Temetra Web User Guide for a complete list.
  desc: The model of meter. - Should be an exact match from models list for the brand shown when editing a meter.
    - If the METERTYPE is generic, the METERMODEL must be GAS, WATER, or ELECTRICITY.
- name: METERTYPE
  page: 18
  required: 'Yes'
  values: Refer the Temetra Web User Guide for a complete list.
  desc: Meter manufacutrer brand
- name: METERUNITS
  page: 18
  type: Depends on meter type
  required: 'Yes'
  values: CCF, CGAL, cu ft, gal, kgal, kL, kVA, kVar, kVarh, kW, kWh, m^3, MCF, ML, PF, Vah, Wh
  desc: Meter units ( m³ , kW etc.) - For new meters, m3 will be used as default if unspecified
- name: METERNOMINALSIZE
  page: 19
  type: Character
  max: 50
  required: 'Yes'
  values: DN15 Coax, DN15, DN20, DN20 Coax, DN25, DN30,DN32, DN40, DN50,DN60, DN65, DN80,DN100, DN125, DN150, DN200,
    DN250, DN300, DN400, DN500, DN600, DN25 Coax, DN75, DN30 Coax
  desc: Nominal size (DN15, DN20 etc.) - should be exact match from Temetra list, including the DN prefix.
- name: METERNOMINALSIZE_IMPERIAL
  page: 19
  type: Character
  max: 50
  values: 1/2", 5/8", 3/4", 5/8 X 3/4", 1", 1.5", 2", 3", 4", 6", 8", 10"
  desc: Nominal size (1", 2", etc.) - quotation mark is optional.
- name: METERFORMAT
  page: 19
  type: 8.3, 9.2 etc.
  required: 'Yes'
  values: 10.3, 10.2, 10.1, 9.4, 9.3, 9.2, 9.1, 9.0, 8.4, 8.3, 8.2, 8.1, 8.0, 7.3, 7.2, 7.1, 7.0, 6.3, 6.2, 6.1,
    6.0, 5.2, 5.1, 5.0, 4.0, 3.0
  desc: Meter index digits in the form a.b where a is total number of digits and b is digits after the decimal point.
    For example 8.3 describes a meter with 8 digits in total, five (normally black) digits recording cubic meters
    and three (normally red) digits down to accuracy of one liter.
- name: NOTE1
  page: 19
  type: Text
  desc: Add a note to the meter, unless one already exists with the same content
- name: NOTE2
  page: 19
  type: Text
  desc: Add a second note to the meter, as above.
- name: NOTE3
  page: 20
  type: Text
  desc: Add a third note to the meter, as above.
- name: CATEGORY
  page: 20
  type: Character
  max: 50
  desc: Set the Category for the meter. If the name does not match an existing entry, it will be added to the list.
- name: IGNORE
  page: 20
  type: Boolean
  required: 'Yes'
  values: Yes/No
  desc: If this column exists in the file, and the contents are "yes" or "true" then this row will be ignored. This
    is useful when dealing with spreadsheet files that contain information unrelated to Temetra. For example, you
    may want to retain your own heading names on the second row of the spreadsheet, so you could add an IGNORE heading
    to the first row and set the value to yes on the second row.
- name: GPS
  page: 20
  type: Character
  max: 32
  values: Must match a recognized GPS format (Refer to Appendix G – Supported GPS Coordinates on page 1 for more
    details).
  desc: Can be used to update the GPS field of the meter.
- name: DMA
  page: 21
  type: Selected from dropdown menu
  desc: Update the DMA for the meter - name should be an exact match of existing DMA.
- name: SEQUENCE
  page: 21
  type: Integer
  max: 10 digits
  required: 'Yes'
  values: Not null
  desc: Update the meter reading sequence number.
- name: ROUTENAME
  page: 21
  type: Alphanumeric
  required: 'Yes'
  desc: Update the route - name should be an exact match of existing Route.
- name: ROUTECODE
  page: 21
  type: Alphanumeric
  max: 6
  values: Not null
  desc: Update the route code
- name: METERSERIAL
  page: 21
  type: Alphanumeric
  max: 48
  required: 'Yes'
  values: Not null Minimum 5 characters
  desc: Update the meter serial, or can be used to locate the meter.
- name: PROPERTYADDRESS
  page: 21
  type: Alphanumeric
  max: 500
  desc: Update the property address of the meter.
- name: METERINSTALLATIONDATE
  page: 21
  type: date
  desc: 'Format is dd/mm/yyyy Required if replacing an existing meter. If not provided, the meter will not be updated
    and generates the following error: “Replacing meter NNNNNNNN has no installation date (Line NNNN). Skipping."
    For new installations, the import date is used if not present.'
- name: CLEARMETERINSTALLATIONDATE
  page: 22
  type: Used to wipe meter installation date
  desc: If contents are "yes", remove any installation date on the meter.
- name: EXCLUDEFROMHANDHELD
  page: 22
  type: Used to exclude meter from handheld
  desc: If contents are "yes", this meter will not appear on the handheld to be read.
- name: EXCLUDEFROMCONSUMPTION
  page: 22
  desc: If contents are "yes", this meter will not be included in consumption reporting
- name: PIPESIZEMM
  page: 22
  type: Text
  values: ½" 12mm, ¾" 18mm , 1" 25mmf 1¼" 32mm, 1½" 38mm, 2" 50mm, 3" 75mm, 4" 100mm, 6" 150mm, 8" 200mm, ⅜" 9mm
  desc: Size in mm of pipework - closest in size from Temetra list will be selected
- name: PIPETYPE
  page: 22
  type: Text – Must Match
  values: PVC, Wavin (old), Copper Lead, Hardened Plastic, HDPE HG, HDPE NG, Lead, Copper, Other, Copper PVC, Lead
    PVC, Copper PVC, Qualplex, PVC Class C, Gun Barrel, Cast Iron, Galvanized Iron, HDPE HG and Lead
  desc: Pipe Type or material - Must be an exact match for name in Temetra's list of pipe types
- name: ACCOUNTREF
  page: 22
  type: Character Characters
  max: 25 25
  required: 'Yes'
  values: Not null, must be unique to Net Not null, unique
  desc: Update the account reference for the account currently attached to this connection Use to look up an account.
- name: CHAMBER
  page: 23
  type: Text
  values: ■ Block 900mm Manhole ■ Concentric Box ■ Waterfit Mark III ■ Ford Meterbox ■ Cast Concrete ■ Internal
    ■ Block ■ Block 600mm Manhole ■ Atplas ■ Ebco ■ Building ■ Matrix ■ Stopcock ■ Masonry ■ Metal Chamber ■ Wavin
    ■ Cavanagh ■ FH ■ Galco ■ None ■ Talbot ■ Uisce ■ Cahors ■ WSCR
  desc: Chamber type - Must be an exact match for name in Temetra's list of chamber types
- name: CHAMBERSURROUNDINGS
  page: 24
  values: ■ Flagged Paving ■ Concrete ■ Tar ■ Brick ■ Grass Verge ■ Footpath/Drive way ■ Roadway ■ Cobblelock ■
    Bitmac ■ Asphalt ■ Regional Road ■ National Road ■ Precast Concrete Flags ■ Bitumen ■ Cast Iron ■ Concrete Block
    ■ Earth ■ Plastic ■ Hardstanding ■ Concrete Footpath ■ Tarmac Footpath ■ Paved Footpath ■ Unpaved Footpath
  desc: Chamber surroundings - Must be an exact match for name in Temetra's list of chamber surroundings
- name: EFR
  page: 25
  values: '''Zero'' = Inactive (No consumption is expected. Any consumption will be identified as an Unexpected
    Flow.) Blank = Active (Consumption is expected. Meters with no consumption since the last read will be identified
    as No Usage.)'
  desc: EFR (Expected Flow Rate).
- name: OWNER
  page: 25
  type: Character
  max: 60
  desc: Name of person who owns this meter.
- name: NEWMETERSERIAL
  page: 25
  type: Same as MeterSerial
  values: Minimum 5 characters
  desc: New meter serial number for this meter. Used when needing to update existing meter serial without needing
    a new meter replacement. Old value is specified in meterserial, new value in newmeterserial.
- name: NEWACCOUNTREF
  page: 26
  type: Same as above
  desc: If present, will be used to change the existing account ref to this value. There is a special case handled
    where the new account ref is already the ref of a pre-existing account. In this case, the account ref cannot
    be updated (would cause a duplicate ref on two accounts), so the meters of the ACCOUNTREF account are moved
    to the pre-existing NEWACCOUNTR EF account with, leaving the old ACCOUNTREF account with no meters.
- name: ACCOUNTNAME
  page: 26
  type: Character
  max: 100
  required: 'Yes'
  desc: Update the name with this value.
- name: ADDRESS
  page: 26
  type: Character
  max: 500
  desc: The full address of the customer using a comma to separate lines.
- name: ADDRESSLINE1
  page: 26
  required: 'Yes'
  desc: First line of customer's address
- name: ADDRESSLINE2
  page: 26
  desc: Additional address lines for customer.
- name: ADDRESSLINE3
  page: 26
  desc: Additional address lines for customer.
- name: ADDRESSLINE4
  page: 26
  desc: Additional address lines for customer.
- name: ADDRESSLINE5
  page: 27
  desc: Additional address lines for customer.
- name: ADDRESSLINE6
  page: 27
  desc: Additional address lines for customer.
- name: ADDRESSLINE7
  page: 27
  desc: Additional address lines for customer.
- name: ADDRESSPOSTCODE
  page: 27
  type: Character
  max: 30
  desc: Postcode for customer address
- name: PHONE
  page: 27
  type: Character
  max: 50
  desc: Customer's main phone number
- name: BILLINGPOSTCODE
  page: 27
  type: Character
  max: 30
  desc: Postcode for customer's billing address.
- name: CUSTOMEREMAIL1
  page: 27
  type: Character
  max: 100
  values: Must be valid Email address.
  desc: 'Customer''s main email address. Note: Including this field with a blank value does not edit or delete the
    current email address. Provide a new email address in the CSV file or edit/delete the address manually in the
    Web Application using Edit Account.'
- name: CUSTOMEREMAIL1PORTAL
  page: 27
  type: Text
  values: True False (not case sensitive)
  desc: Gives permission for the CUSTOMEREMAIL1 address to log in and view meters in the Customer Portal.
- name: CUSTOMEREMAIL2
  page: 28
  type: Character
  max: 100
  values: Must be valid Email address.
  desc: 'Alternative customer main email address. Note: Including this field with a blank value does not edit or
    delete the current email address. Provide a new email address in the CSV file or edit/delete the address manually
    in the Web Application using Edit Account.'
- name: CUSTOMEREMAIL2PORTAL
  page: 28
  type: Text
  values: True False (not case sensitive)
  desc: Gives permission for the CUSTOMEREMAIL2 address to log in and view meters in the Customer Portal.
- name: METERCOMMENT
  page: 28
  type: Text
  desc: Update the Meter Comment field with this value.
- name: REPLACEMENTMETERSERIAL
  page: 28
  type: Alphanumeric
  max: 48
  values: Minimum 5 chars
  desc: Replaces the existing meter serial and marks the meter as replaced. If using CREF values, meter replacements
    are processed automatically and this column is not used.
- name: NEWCREF
  page: 28
  type: Alphanumeric
  max: 30
  values: Must be unique per network.
  desc: New connection reference.
- name: FINALDECIMALINDEX
  page: 29
  type: Decimal
  desc: Final Index of the replaced meter.
- name: FINALREADDATETIME
  page: 29
  type: Date in format DD/MM/YYYY AM/PM
  desc: Final read date and time of the replaced meter.
- name: NEWDECIMALINDEX
  page: 29
  type: Decimal
  desc: New index of the new meter in case of meter replacement.
- name: NEWREADDATETIME
  page: 29
  type: Date in format DD/MM/YYYY AM/PM
  desc: New read date and time of the new meter in case of meter replacement.
- name: ENABLEACCOUNT
  page: 29
  type: Text
  values: True False
  desc: 'Enable or disable an account False : disable an account True: Enable an account'
- name: PERMANENTLYDISCONNECTED
  page: 29
  type: Text
  values: True False
  desc: Permanently disconnect a meter
- name: LON
  page: 30
  type: Decimal degrees
  max: 9
  values: xy.abcdef
  desc: 'GPS coordinates can be supplied using CSV, specifying either the LAT/LON columns OR the GPS column. Temetra
    uses the WGS84 standard for GPS devices. Coordinates can be supplied in decimal degrees or degree minutes. When
    supplying coordinates, the following rules apply: ■ Decimal Degrees - specify a minimum of 6 and a maximum of
    9 digits after the decimal point. ■ Degree Minutes - specify a minimum of 6 and a maximum of 8 digits after
    thedecimal point. ■ Latitude: – GPS column: requires an N or S designator. – LAT column: defaults to North.
    Use a minus sign (-) to designate South. ■ Longitude: – GPS column: requires an E or W of the prime meridian
    designator. – LON column: defaults to East of the prime meridian. Use a minus sign (-) to designate West of
    the prime meridian. Examples: ■ Decimal Degrees: GPS- N47.644169 W117.078466 = LAT 47.644169 LON - 117.078466
    ■ Degree Minutes: GPS- N47 38.650140 W117 4.707960 = LAT 47 38.650140 LON - 117 4.707960'
- name: LAT
  page: 32
  type: Decimal degrees
  max: 9
  values: xy.abcdef
  desc: GPS coordinates can be supplied using CSV, specifying either the LAT/LON columns OR the GPS column (refer
    to the description in LON).
- name: METERLOCATIONCODE
  page: 32
  type: Text
  max: 8
  values: Must be an existing code otherwise an error will be raised.
  desc: Meter location code
- name: AMRGROUP
  page: 32
  type: Number
  desc: Identify the AMR Group Reading
- name: ADDTAG
  page: 32
  type: Character
  max: 500
  desc: Add a tag to the tags field of the meter if it is not already there.
- name: REMOVETAG
  page: 32
  type: Character
  values: Remove any existing tags that match tags currently present on the meter.
  desc: Remove a tag from the tags field of the meter.
