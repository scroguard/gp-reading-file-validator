# Temetra import files: XML structure and rules not captured in the generated
# element dictionary (temetra_elements.yaml), plus the CSV file-type rules.
#
# Sources (page numbers are each guide's own "Page N"):
#   XML: Itron "Temetra XML File Format Reference Guide" LDI-0587 REV 002 (May 2025)
#   CSV: Itron "Temetra NAM CSV File Format Guide" LDI-0665 REV 002 (December 2024).
#        It supersedes "Temetra CSV File Format Guide" LDI-0351 REV 003 (September 2023)
#        for North America; the older guide is consulted only where the NAM guide is silent.

product: Temetra
format: Temetra Import
guide: Itron Temetra XML File Format Reference Guide LDI-0587 REV 002 (May 2025)

xml:
  namespace: http://www.itron.com/nVanta          # p.7
  pages: {sections: 9, xml_rules: 7, codes: 11, worksets: 19, ampersand: 10, workset_id: 23,
          single_input: 20, read_method: 38, read_method_5: 38}
  sections: [Codes, Messages, WorkSets]
  # Temetra supports three code types, in this order (diagram p.11).
  codes:
    - {collection: SkipCodes, entity: SkipCode}
    - {collection: InstructionLocationCodes, entity: InstructionLocationCode}
    - {collection: TroubleCommentCodes, entity: TroubleCommentCode}
  messages: {collection: Messages, entity: Message}
  worksets: {collection: WorkSets, entity: WorkSet}
  attributes:
    Ownership: {note: "Not currently used but still required (p.9)."}
    ForceLoad: {values: ["true", "false", "True", "False"], note: "On code collections (p.11)."}
  # "Ownership is not currently used but is still required" (p.9).
  required_attributes: {Codes: [Ownership], Messages: [Ownership], WorkSets: [Ownership]}
  extra_children:
    Work: [GPSInformation, CustomDataField]        # p.19 diagram and prose
    MeterSessionInput: [AdvancedAMRRequest]        # p.20-21; the table on p.46 puts it in MeterSessionInputRF
  single_input: [MeterSessionInputRF, MeterSessionInputRemote]   # p.20
  forbidden_characters: "&"                        # p.10
  unique_workset_ids: true                         # "Temetra requires WorkSetID values to be unique" (p.23)
  read_method_missing_note: "Without it the meter cannot be read by that method"

read_method_children:
  "2": MeterSessionInputRemote
  "3": MeterSessionInputRF
  "4": MeterSessionInputRF

workset_id:
  length: 8
  forbidden: "\\/:*?\"<>|&'[= "

overrides:
  - {entity: Meter, element: Segment, values: [], num_range: [1, 9999], not_all_zeros: true,
     note: "Walk-by routes 1-9999, drive-by routes 1-255 (p.34). The parser read 'Walk-by' as a value."}
  - {entity: WorkSet, element: AverageRouteTime, import_rule: optional, note: "Import requirement not stated (p.24)."}
  - {entity: SkipCode, element: PhotoPromptIndicator, alias: PhotoPromptInd,
     note: "The table says PhotoPromptIndicator; the guide's own example uses <PhotoPromptInd> (p.11)."}

# ---------------------------------------------------------------------------
# CSV import (NAM CSV guide LDI-0665). Page numbers are that guide's pages.
csv:
  guide: Itron Temetra NAM CSV File Format Guide LDI-0665 REV 002 (December 2024)
  # UTF-8, header row 1, headings uppercase and unique; do not rely on column
  # order except where stated (p.7).
  # File types, detected from the file name and header row.
  file_types:
    meter_replacement:
      name: Meter Replacement
      filename_prefix: meterreplacement            # p.14
      detect: [REPLACEMENTMETERSERIAL, FINALDECIMALINDEX]
      required: [METERSERIAL, CREF, REPLACEMENTMETERSERIAL, NEWCREF, METERTYPE, METERMODEL, METERUNIT,
                 METERINSTALLATIONDATE, FINALDECIMALINDEX, FINALREADDATETIME, NEWDECIMALINDEX, NEWREADDATETIME]
      page: 14
    schedule:
      name: Automatic Schedule Creation
      filename_prefix: new-schedules-from-existing-meters-   # p.42
      detect: [SCHEDULENAME, FROMDATE, TODATE]
      required: [CREF, METERSERIAL, SCHEDULENAME, FROMDATE, TODATE]  # CREF must be in the header; values optional (p.42)
      page: 41
    deschedule:
      name: De-scheduling
      filename_prefix: deschedule-existing-          # p.43, not case sensitive
      detect_any: [DESCHEDULE, DESCHEDULEALLFUTURE]
      page: 42
    historical_reads:
      name: Historical Reads Import
      detect: [READTIME, DECIMALINDEX]
      required: [METERSERIAL, READTIME, DECIMALINDEX]
      page: 38
    new_asset:
      name: Network New Asset
      first_columns: [IGNORE, CANCREATE]             # p.10, p.13
      # Mandatory columns (p.12-13), plus METERTYPE, METERMODEL and COLLECTIONMETHOD,
      # which the field table marks Required (p.16, p.18) and Itron's annotated sample lists as mandatory.
      required: [IGNORE, CANCREATE, CREF, METERSERIAL, METERUNITS, METERFORMAT, METERTYPE, METERMODEL, COLLECTIONMETHOD]
      required_one_of: [[METERNOMINALSIZE, METERNOMINALSIZE_IMPERIAL]]
      # Marked Required in the field table but not in the New Asset mandatory list: warn if absent.
      recommended: [ACCOUNTREF, ACCOUNTNAME, ADDRESSLINE1, ROUTENAME, SEQUENCE]
      page: 12
    data_update:
      name: Meters and Customers Data Update
      required: [METERSERIAL]                        # p.36; CREF and METERSERIAL first is recommended
      page: 36

  # Column rules. kind: text | number | integer | decimal | date | datetime | yesno | truefalse |
  # email | gps | lat | lon | tags. `values` are exact matches; `values_warn` lists that
  # only produce a warning when a value is not in them (lists the guide says depend on
  # the network, or that Itron's own sample departs from). `required` = value may not be blank.
  fields:
    IGNORE: {kind: yesno, page: 20}
    CANCREATE: {kind: yesno, page: 15}
    CREF: {kind: text, max: 30, unique: true, page: 15}
    MCATEGORY: {kind: text, values: ["0", "1", "4"], page: 15}
    COLLECTIONMETHOD: {kind: text, page: 16, values: ["Manual Read", "Wireless", "Gen5 500G ERT", "Gen5 500W ERT",
      "Gen5 Intelis Gas", "Riva 500G ERT", "Riva 500W ERT", "Cellular 500W ERT", "Cellular 500G ERT", "Wand", "Fixed Network"]}
    MIUSERIAL: {kind: number, max: 50, unique: true, page: 17}
    MIUINSTALLATIONDATE: {kind: date, page: 17}
    ADDACCOUNTTAG: {kind: tags, max: 500, tag_set: customer, page: 17}
    REMOVEACCOUNTTAG: {kind: text, page: 18}
    METERBRAND: {kind: text, page: 18}
    METERMODEL: {kind: text, page: 18}
    METERTYPE: {kind: text, page: 18}
    METERUNITS: {kind: text, page: 18, values_warn: [CCF, CGAL, cu ft, gal, kgal, kL, kVA, kVar, kVarh, kW, kWh, "m^3", m3, MCF, ML, PF, Vah, Wh]}
    METERUNIT: {kind: text, page: 14, same_as: METERUNITS}
    METERNOMINALSIZE: {kind: text, max: 50, page: 19, values_warn: [DN15 Coax, DN15, DN20, DN20 Coax, DN25, DN30, DN32, DN40, DN50,
      DN60, DN65, DN80, DN100, DN125, DN150, DN200, DN250, DN300, DN400, DN500, DN600, DN25 Coax, DN75, DN30 Coax]}
    METERNOMINALSIZE_IMPERIAL: {kind: text, max: 50, page: 19, strip_quotes: true,
      values_warn: ["1/2", "5/8", "3/4", "5/8 X 3/4", "1", "1.5", "2", "3", "4", "6", "8", "10"]}
    METERFORMAT: {kind: meterformat, page: 19, values: ["10.3", "10.2", "10.1", "9.4", "9.3", "9.2", "9.1", "9.0", "8.4", "8.3", "8.2",
      "8.1", "8.0", "7.3", "7.2", "7.1", "7.0", "6.3", "6.2", "6.1", "6.0", "5.2", "5.1", "5.0", "4.0", "3.0"]}
    NOTE1: {kind: text, page: 19}
    NOTE2: {kind: text, page: 19}
    NOTE3: {kind: text, page: 20}
    CATEGORY: {kind: text, max: 50, page: 20}
    GPS: {kind: gps, max: 32, page: 20}
    DMA: {kind: text, page: 21}
    SEQUENCE: {kind: integer, max_digits: 10, not_null_warn: true, page: 21}
    ROUTENAME: {kind: text, page: 21}
    ROUTECODE: {kind: text, max: 6, page: 21}
    METERSERIAL: {kind: text, max: 48, min: 5, required: true, unique: true, page: 21}
    PROPERTYADDRESS: {kind: text, max: 500, page: 21}
    METERINSTALLATIONDATE: {kind: date, page: 21}
    CLEARMETERINSTALLATIONDATE: {kind: yesno, page: 22}
    EXCLUDEFROMHANDHELD: {kind: yesno, page: 22}
    EXCLUDEFROMCONSUMPTION: {kind: yesno, page: 22}
    PIPESIZEMM: {kind: text, page: 22}
    PIPETYPE: {kind: text, page: 22, values_warn: [PVC, Wavin (old), Copper Lead, Hardened Plastic, HDPE HG, HDPE NG, Lead, Copper, Other,
      Copper PVC, Lead PVC, Qualplex, PVC Class C, Gun Barrel, Cast Iron, Galvanized Iron, HDPE HG and Lead]}
    ACCOUNTREF: {kind: text, max: 25, page: 22}
    CHAMBER: {kind: text, page: 23}
    CHAMBERSURROUNDINGS: {kind: text, page: 24}
    EFR: {kind: text, page: 25}
    OWNER: {kind: text, max: 60, page: 25}
    NEWMETERSERIAL: {kind: text, max: 48, min: 5, page: 25}
    NEWACCOUNTREF: {kind: text, max: 25, page: 26}
    ACCOUNTNAME: {kind: text, max: 100, page: 26}
    ADDRESS: {kind: text, max: 500, page: 26}
    ADDRESSLINE1: {kind: text, page: 26}
    ADDRESSLINE2: {kind: text, page: 26}
    ADDRESSLINE3: {kind: text, page: 26}
    ADDRESSLINE4: {kind: text, page: 26}
    ADDRESSLINE5: {kind: text, page: 27}
    ADDRESSLINE6: {kind: text, page: 27}
    ADDRESSLINE7: {kind: text, page: 27}
    ADDRESSPOSTCODE: {kind: text, max: 30, page: 27}
    PHONE: {kind: text, max: 50, page: 27}
    BILLINGPOSTCODE: {kind: text, max: 30, page: 27}
    CUSTOMEREMAIL1: {kind: email, max: 100, page: 27}
    CUSTOMEREMAIL1PORTAL: {kind: truefalse, page: 27}
    CUSTOMEREMAIL2: {kind: email, max: 100, page: 28}
    CUSTOMEREMAIL2PORTAL: {kind: truefalse, page: 28}
    METERCOMMENT: {kind: text, page: 28}
    REPLACEMENTMETERSERIAL: {kind: text, max: 48, min: 5, page: 28}
    NEWCREF: {kind: text, max: 30, page: 28}
    FINALDECIMALINDEX: {kind: decimal, page: 29}
    FINALREADDATETIME: {kind: datetime, page: 29}
    NEWDECIMALINDEX: {kind: decimal, page: 29}
    NEWREADDATETIME: {kind: datetime, page: 29}
    ENABLEACCOUNT: {kind: truefalse, page: 29}
    PERMANENTLYDISCONNECTED: {kind: truefalse, page: 29}
    LON: {kind: lon, page: 30}
    LAT: {kind: lat, page: 32}
    METERLOCATIONCODE: {kind: text, max: 8, page: 32}
    AMRGROUP: {kind: number, page: 32}
    ADDTAG: {kind: tags, max: 500, tag_set: meter, page: 32}
    REMOVETAG: {kind: text, page: 32}
    # Not in the NAM field list: used in Itron's annotated sample for compound and
    # multi-register meters ("column E is mandatory" for those, with an
    # original-meter-serial=x tag in ADDTAG).
    LINKEDMETERSERIAL: {kind: text, max: 48, page: null}
    # Historical reads (p.38)
    READTIME: {kind: datetime, required: true, page: 38}
    DECIMALINDEX: {kind: decimal, required: true, page: 38}
    TYPE: {kind: text, values: [Wireless, Manual, Estimate, Customer], page: 38}
    COMMENT: {kind: text, page: 38}
    # Schedule creation (p.41-42) and de-scheduling (p.42-43)
    SCHEDULENAME: {kind: text, page: 41}
    ROUTETAGS: {kind: text, page: 41}
    METERTAGS: {kind: tags, tag_set: scheduled, page: 41}
    FROMDATE: {kind: date, required: true, page: 41}
    TODATE: {kind: date, required: true, page: 41}
    REQUESTCOMMENT: {kind: text, page: 41}
    PURPOSE: {kind: text, max: 100, page: 41}
    ASSIGNTO: {kind: text, page: 41}
    ADD-DATES-TO-SCHEDULENAME: {kind: yesno, page: 44}
    GEONAME: {kind: text, page: 42}
    REQUESTREF: {kind: text, page: 42}
    HILITRES: {kind: decimal, page: 42}
    LOLITRES: {kind: decimal, page: 42}
    MREF: {kind: text, page: 42}
    DESCHEDULE: {kind: text, values: ["Y", "YES", "y", "yes", "Yes"], page: 42}
    DESCHEDULEALLFUTURE: {kind: text, values: ["Y", "YES", "y", "yes", "Yes"], page: 42}

  # ADDTAG / ADDACCOUNTTAG / METERTAGS values: space-separated tags, key=value or bare.
  # Tags are utility-defined (p.8), so tags not listed here are warnings only.
  tags:
    meter:
      active-ind: {values: [A, I, S], page: 33}
      mcategory: {values: ["0", "1", "4"], page: 33}
      mi: {max: 20, page: 33}
      readdir: {values: [R, L], page: 33}
      readtype: {pattern: "\\d{2}", desc: "00-99", page: 33}
      rf-frequency: {pattern: "\\d{6}\\.\\d{5}", desc: "000952.00625 format (12 characters with the decimal point)", page: 33}
      rf-tone: {values: ["04", "06", "07", "08", "09", "10", "11", "12", "13", "14"], page: 34}
      ri1: {pattern: "\\d{2}", desc: "00-99", page: 34}
      ri2: {pattern: "\\d{2}", desc: "00-99", page: 34}
      msgdisplay: {values: ["1", "2", "3"], page: 13}
      cellular-device-installed: {bare: true, page: 35}
      cellular-install-failed: {bare: true, page: 34}
      cellular-install-canceled: {bare: true, page: 34}
    customer:
      customer-information: {max: 20, page: 32}
    scheduled:
      negative-dial-creep: {range: [0, 32767], page: 43}
      positive-dial-creep: {range: [0, 32767], page: 44}
      noformat-high-1: {range: [0, 2147483647], page: 43}
      noformat-high-2: {range: [0, 2147483647], page: 43}
      noformat-low-1: {range: [0, 2147483647], page: 44}
      noformat-low-2: {range: [0, 2147483647], page: 44}
      noformat-prev-read: {pattern: "\\d{1,10}", desc: "up to 10 digits", page: 44}
      prevtamper1: {pattern: "\\d{1,4}", desc: "up to 4 digits", page: 44}
      prevtamper2: {pattern: "\\d{1,4}", desc: "up to 4 digits", page: 44}
      prompt-code: {values: [Y, N, M, F], page: 44}
      text-prompt: {max: 4, page: 44}
