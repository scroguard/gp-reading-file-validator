<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reading System File Validator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index').path }}">Reading System File Validator</a>
    <span class="muted">v{{ version }}</span>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
