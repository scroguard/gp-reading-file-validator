[project]
name = "rsvalidator"
version = "1.0.0.dev0"
description = "Validates meter-reading-system host files against their published interface guides"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsvalidator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
