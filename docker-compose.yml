services:
  validator:
    # Built locally from this repository; there is no published image to pull.
    build: .
    pull_policy: build
    container_name: rsvalidator
    restart: unless-stopped
    ports:
      # The app listens on port 9898 inside the container. Pick ONE of these.
      # Uploaded files contain customer names and addresses, and the app has no
      # login of its own, so expose it as narrowly as you can.
      #
      # B) Reverse proxy on ANOTHER host, reached over a VPN (default):
      #    publish only on this host's VPN address, so the app is reachable
      #    through the VPN but not from the rest of the network.
      #    >>> REQUIRED: set RSV_BIND_IP to this host's VPN IP address (for
      #    >>> example 10.8.0.5), either in a .env file next to this one (copy
      #    >>> .env.example) or on the command line:
      #    >>>   RSV_BIND_IP=10.8.0.5 docker compose up -d --build
      #    >>> The container will not start until it is set.
      - "${RSV_BIND_IP:?Set RSV_BIND_IP to this host's VPN IP in .env or the environment (see .env.example)}:9898:9898"
      #
      # A) Reverse proxy on THIS host: only this machine can connect. The most
      #    locked-down choice; use it whenever the proxy runs on this machine.
      # - "127.0.0.1:9898:9898"
      #
      # C) No proxy, on a local network you trust: publish on all interfaces.
      #    Anyone who can reach this host can use the app.
      # - "9898:9898"
    environment:
      RSV_MAX_UPLOAD_MB: "50"          # largest file accepted
      RSV_REPORT_TTL_MINUTES: "30"     # how long a report stays downloadable as PDF
      RSV_MAX_CACHED_REPORTS: "20"     # reports kept in memory at once
      # If your reverse proxy serves the app under a sub-path (for example
      # https://example.com/validator/), set it here. Leave empty when the app has
      # its own host name (https://validator.example.com/).
      RSV_BASE_PATH: ""
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
